<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>this week</title>
  <meta name="theme-color" content="#f4efff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="this week" />
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    .w {
      max-width: 560px;
      margin: 0 auto;
      padding: max(13vh, 84px) 24px 140px;
    }

    .w .home {
      display: inline-block;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink-3);
      transition: color 0.2s ease;
    }

    .w .home:hover { color: var(--ink); }

    .w h1 {
      margin-top: 6px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.035em;
      font-weight: 500;
      text-wrap: balance;
    }

    .w .sub {
      margin-top: 10px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    .w .sub b {
      font-weight: 400;
      color: var(--ink-2);
    }

    .w .memo {
      margin-top: 22px;
      color: var(--ink-2);
      max-width: 52ch;
    }

    /* lock */

    .w form.lock {
      margin-top: 40px;
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .w input[type="password"],
    .w input[type="text"] {
      font: inherit;
      color: var(--ink);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 6px 0;
      outline: none;
      width: 100%;
      max-width: 320px;
    }

    .w input:focus { border-bottom-color: var(--ink); }

    .w .lock button,
    .w .sync button {
      color: var(--ink-3);
      transition: color 0.2s ease;
    }

    .w .lock button:hover,
    .w .sync button:hover { color: var(--ink); }

    .w .err {
      margin-top: 12px;
      color: var(--accent);
      font-size: 14px;
      min-height: 1.6em;
    }

    /* projects */

    .w .proj { margin-top: 52px; }

    .w .proj h2 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .w .proj h2 .c {
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-4);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .w .proj h2 .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      align-self: center;
      transform: scale(0);
      transition: transform 0.5s var(--spring);
    }

    .w .proj.all h2 .dot { transform: scale(1); }
    .w .proj.all h2 .c { color: var(--ink-3); }

    .w ul { margin-top: 10px; }

    .w li {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .w li:last-child { border-bottom: 1px solid var(--line); }

    .w .tick {
      position: relative;
      flex: none;
      width: 18px;
      height: 18px;
      margin-top: 4px;
      border-radius: 50%;
      border: 1.5px solid var(--ink-4);
      display: grid;
      place-items: center;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
      touch-action: manipulation;
    }

    .w .tick:hover { border-color: var(--ink-3); }

    .w .tick svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: var(--bg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
    }

    .w li.done .tick {
      background: var(--ink);
      border-color: var(--ink);
    }

    .w li.done .tick svg { stroke-dashoffset: 0; }

    .w li.pop .tick { animation: pop 0.5s var(--spring); }
    .w li.pop .tick svg { transition: stroke-dashoffset 0.28s ease 0.08s; }

    @keyframes pop {
      0% { transform: scale(1); }
      30% { transform: scale(0.78); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .w .body {
      flex: 1;
      min-width: 0;
      line-height: 1.55;
    }

    /* the strike draws itself across, line by line */
    .w .t {
      background: linear-gradient(var(--ink-3), var(--ink-3)) no-repeat 0 58% / 0% 1px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      transition: color 0.35s ease;
    }

    .w li.done .t {
      color: var(--ink-3);
      background-size: 100% 1px;
    }

    .w li.pop .t { transition: background-size 0.42s var(--ease), color 0.35s ease 0.2s; }

    .w .meta {
      display: block;
      font-size: 13px;
      color: var(--ink-4);
    }

    .w .x {
      flex: none;
      font-size: 13px;
      color: var(--ink-4);
      padding-top: 3px;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .w li:hover .x,
    .w .x:focus-visible { opacity: 1; }
    .w .x:hover { color: var(--ink); }

    @media (hover: none) { .w .x { opacity: 1; } }

    .w .spark {
      position: absolute;
      left: 9px;
      top: 22px;
      width: 3px;
      height: 3px;
      margin: -1.5px;
      border-radius: 50%;
      background: var(--ink-3);
      pointer-events: none;
      animation: spark 0.55s var(--ease) forwards;
    }

    @keyframes spark {
      from { transform: translate(0, 0); opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }

    .w .add {
      margin-top: 10px;
      font-size: 14px;
      color: var(--ink-4);
      transition: color 0.2s ease;
    }

    .w .add:hover { color: var(--ink-2); }

    .w .adding {
      margin-top: 6px;
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .w .adding input { max-width: none; }

    .w .empty {
      margin-top: 52px;
      color: var(--ink-3);
    }

    /* earlier weeks */

    .w .earlier { margin-top: 84px; }

    .w .earlier h3 {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-3);
      margin-bottom: 6px;
    }

    .w details { border-top: 1px solid var(--line); }
    .w details:last-of-type { border-bottom: 1px solid var(--line); }

    .w summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      cursor: pointer;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }

    .w summary::-webkit-details-marker { display: none; }
    .w summary span { color: var(--ink-4); }
    .w summary:hover { color: var(--ink); }

    .w .past {
      padding: 2px 0 14px;
      font-size: 14px;
      color: var(--ink-3);
    }

    .w .past p { padding: 2px 0; }
    .w .past .pn { margin-top: 8px; color: var(--ink-2); }
    .w .past .y { color: var(--ink-4); text-decoration: line-through; }

    /* footer */

    .w .links {
      margin-top: 64px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 14px;
      color: var(--ink-3);
    }

    .w .links button { transition: color 0.2s ease; }
    .w .links button:hover { color: var(--ink); }

    .w .sync {
      margin-top: 18px;
      font-size: 14px;
      color: var(--ink-3);
    }

    .w .sync p { margin-bottom: 8px; max-width: 52ch; }

    .w .sync form {
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .w .status {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 14px;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .w .status button { color: var(--ink); }

    .w .open-in { animation: rise 0.6s var(--spring) both; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .w *, .w *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <main class="w">
    <a class="home" href="/">nav</a>
    <h1 id="title">this week</h1>
    <p class="sub" id="sub"></p>

    <div id="locked">
      <form class="lock" id="lockform">
        <input type="password" id="pw" placeholder="password" autocomplete="current-password" autofocus />
        <button type="submit" id="lockgo">open</button>
      </form>
      <p class="err" id="err"></p>
    </div>

    <div id="open" hidden>
      <p class="memo" id="memo" hidden></p>
      <div id="projects"></div>
      <div class="earlier" id="earlier" hidden>
        <h3>earlier</h3>
        <div id="pastlist"></div>
      </div>
      <div class="links">
        <button type="button" id="syncbtn">sync</button>
        <button type="button" id="soundbtn">sound on</button>
        <button type="button" id="lockbtn">lock</button>
      </div>
      <div class="sync" id="syncbox" hidden>
        <p>to save from any device, paste a github fine-grained token with access to only navthings.github.io and contents set to read and write. it stays on this device, encrypted with the password.</p>
        <form id="syncform">
          <input type="text" id="tok" placeholder="github_pat_..." autocomplete="off" spellcheck="false" />
          <button type="submit">save</button>
          <button type="button" id="untok">remove</button>
        </form>
      </div>
    </div>

    <p class="status" id="status" role="status" hidden></p>
  </main>

  <script src="/assets/base.js"></script>
  <script>
    const REPO = "navthings/navthings.github.io";
    const API = (p) => `https://api.github.com/repos/${REPO}/contents/goals/${p}`;
    const ITER = 600000;
    const KEEP = ["dice-of-god", "liltvc", "vex", "maths + physics"];
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const $ = (id) => document.getElementById(id);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    let key = null;
    let salt = null;
    let state = null;
    let token = null;
    let shas = {};
    let saveTimer = null;
    let undo = null;
    let fresh = false;

    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const uid = () => Math.random().toString(36).slice(2, 9);

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      del(k) { try { localStorage.removeItem(k); } catch {} },
    };

    // password side: same scheme as before, so the old password and saved token still work

    async function deriveKey(pw, saltBytes) {
      const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: saltBytes, iterations: ITER, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function seal(text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return { v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
    }

    async function unseal(blob) {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
      return dec.decode(pt);
    }

    // claude side: plans arrive sealed to a public key, only this page holds the private half

    async function makeInboxKeys() {
      const pair = await crypto.subtle.generateKey(
        { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
        true,
        ["encrypt", "decrypt"]
      );
      state.pub = b64(await crypto.subtle.exportKey("spki", pair.publicKey));
      state.priv = b64(await crypto.subtle.exportKey("pkcs8", pair.privateKey));
    }

    async function openPlan(entry) {
      const priv = await crypto.subtle.importKey("pkcs8", unb64(state.priv), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
      const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, priv, unb64(entry.k));
      const aes = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(entry.iv) }, aes, unb64(entry.ct));
      return JSON.parse(dec.decode(pt));
    }

    // github

    async function ghGet(name) {
      const r = await fetch(API(name) + "?t=" + Date.now(), {
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
        cache: "no-store",
      });
      if (r.status === 404) { shas[name] = undefined; return null; }
      if (!r.ok) throw new Error(`github said ${r.status}`);
      const j = await r.json();
      shas[name] = j.sha;
      return atob(j.content.replace(/\n/g, ""));
    }

    async function ghPut(name, text, msg, retry = true) {
      const r = await fetch(API(name), {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
        body: JSON.stringify({ message: msg, content: btoa(text), sha: shas[name] }),
      });
      if ((r.status === 409 || r.status === 422) && retry) {
        await ghGet(name);
        return ghPut(name, text, msg, false);
      }
      if (!r.ok) throw new Error(`github said ${r.status}`);
      shas[name] = (await r.json()).content.sha;
    }

    // dates. weeks are named by their monday

    const pad = (n) => String(n).padStart(2, "0");
    const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    function mondayOf(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return x;
    }
    function range(id) {
      const a = parse(id);
      const b = new Date(a);
      b.setDate(b.getDate() + 6);
      const mon = (d) => d.toLocaleDateString("en-AU", { month: "short" }).toLowerCase();
      return a.getMonth() === b.getMonth() ? `${a.getDate()} to ${b.getDate()} ${mon(b)}` : `${a.getDate()} ${mon(a)} to ${b.getDate()} ${mon(b)}`;
    }

    // state

    function blank() {
      return { schema: 2, updated: new Date().toISOString(), weeks: [], seen: [], pub: null, priv: null };
    }

    function weekNow() {
      return state.weeks[0] || null;
    }

    function ensureWeek(id) {
      let w = state.weeks.find((x) => x.id === id);
      if (w) return w;
      const prev = state.weeks.filter((x) => x.id < id)[0];
      w = { id, note: "", projects: [] };
      // whatever didn't get done comes along
      if (prev) {
        for (const p of prev.projects) for (const t of p.tasks) {
          if (t.done) continue;
          projectIn(w, p.name).tasks.push({ id: uid(), t: t.t, done: false, carried: (t.carried || 0) + 1 });
        }
      }
      state.weeks.push(w);
      state.weeks.sort((a, b) => (a.id < b.id ? 1 : -1));
      return w;
    }

    function projectIn(w, name) {
      let p = w.projects.find((x) => x.name === name);
      if (!p) { p = { name, tasks: [] }; w.projects.push(p); }
      return p;
    }

    function takePlan(plan) {
      const w = ensureWeek(plan.week);
      if (plan.note) w.note = plan.note;
      const order = [];
      for (const pp of plan.projects || []) {
        const p = projectIn(w, pp.name);
        order.push(p);
        const have = new Set(p.tasks.map((t) => t.t.toLowerCase()));
        for (const text of pp.tasks || []) {
          if (have.has(text.toLowerCase())) continue;
          p.tasks.push({ id: uid(), t: text, done: false });
          have.add(text.toLowerCase());
        }
      }
      w.projects = [...order, ...w.projects.filter((p) => !order.includes(p))];
      state.seen.push(plan.week);
      // a week that never got anything in it isn't worth keeping
      state.weeks = state.weeks.filter((x) => x.id === plan.week || x.projects.some((p) => p.tasks.length));
    }

    async function checkInbox() {
      let box = null;
      // github first when synced, since the live site takes a minute to catch up
      try {
        if (token) {
          const text = await ghGet("inbox.json");
          if (text) box = JSON.parse(text);
        }
      } catch {}
      if (!box) {
        try {
          const r = await fetch("inbox.json?t=" + Date.now(), { cache: "no-store" });
          if (r.ok) box = await r.json();
        } catch {}
      }
      if (!box || !state.priv) return false;
      let took = false;
      for (const entry of [...(box.weeks || [])].sort((a, b) => (a.week < b.week ? -1 : 1))) {
        if (state.seen.includes(entry.week)) continue;
        try {
          takePlan(await openPlan(entry));
          took = true;
        } catch {
          // sealed to an older key, nothing to do
          state.seen.push(entry.week);
        }
      }
      return took;
    }

    async function publishKey() {
      if (!token || !state.pub) return;
      try {
        const live = await ghGet("inbox.pub");
        if (live && live.trim() === state.pub) return;
        await ghPut("inbox.pub", state.pub + "\n", "goals: inbox key");
      } catch (e) {
        say(`couldn't publish the inbox key (${e.message})`);
      }
    }

    // unlock

    async function unlock(pw) {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      let site = r.ok ? await r.json() : null;
      let localBlob = null;
      try { localBlob = JSON.parse(store.get("goals.local")); } catch {}
      salt = site ? unb64(site.salt) : localBlob ? unb64(localBlob.salt) : crypto.getRandomValues(new Uint8Array(16));
      key = await deriveKey(pw, salt);

      let best = null;
      if (site) {
        try {
          best = JSON.parse(await unseal(site));
        } catch {
          key = null;
          throw new Error("wrong password");
        }
      }

      const sealedTok = store.get("goals.tok");
      if (sealedTok) {
        try { token = await unseal(JSON.parse(sealedTok)); } catch { store.del("goals.tok"); }
      }

      if (token) {
        try {
          const live = await ghGet("data.json");
          if (live) best = JSON.parse(await unseal(JSON.parse(live)));
        } catch (e) {
          say(navigator.onLine ? `couldn't reach github (${e.message}), using the last saved copy` : "offline. ticks save here and go up next time you're online");
        }
      }

      if (localBlob) {
        try {
          const mine = JSON.parse(await unseal(localBlob));
          if (mine.schema === 2 && (!best || best.schema !== 2 || mine.updated > best.updated)) best = mine;
        } catch {}
      }

      // anything from the old goals page gets left behind
      if (!best || best.schema !== 2) {
        state = blank();
        fresh = true;
      } else {
        state = best;
      }
      if (!state.priv) await makeInboxKeys();

      const took = await checkInbox();
      if (!state.weeks.length) ensureWeek(iso(mondayOf(new Date())));
      if (!weekNow().projects.length) KEEP.forEach((name) => projectIn(weekNow(), name));

      await publishKey();
      if (fresh || took) changed(false);
    }

    function changed(redraw = true) {
      state.updated = new Date().toISOString();
      if (redraw) render();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 1200);
    }

    async function save() {
      const blob = JSON.stringify(await seal(JSON.stringify(state)));
      store.set("goals.local", blob);
      if (!token) {
        if (!save.told) say("saved on this device. set up sync to save it everywhere");
        save.told = true;
        return;
      }
      if (!navigator.onLine) return say("offline, saved here. it goes up when you're back");
      try {
        if (shas["data.json"] === undefined) await ghGet("data.json");
        await ghPut("data.json", blob + "\n", "update goals");
      } catch (e) {
        say(`saved here, github failed (${e.message})`);
      }
    }

    // feel

    let audio = null;
    let sound = store.get("goals.sound") !== "off";

    function chime(notes, gain = 0.05) {
      if (!sound) return;
      try {
        audio ||= new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audio.currentTime;
        notes.forEach((f, i) => {
          const t = t0 + i * 0.09;
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
          o.connect(g).connect(audio.destination);
          o.start(t);
          o.stop(t + 0.55);
        });
      } catch {}
    }

    function sparks(li) {
      if (reduce) return;
      for (let i = 0; i < 7; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        const a = (i / 7) * Math.PI * 2 + Math.random() * 0.4;
        const d = 13 + Math.random() * 7;
        s.style.setProperty("--dx", Math.cos(a) * d + "px");
        s.style.setProperty("--dy", Math.sin(a) * d + "px");
        li.append(s);
        setTimeout(() => s.remove(), 600);
      }
    }

    function say(msg, withUndo) {
      const el = $("status");
      el.textContent = msg;
      if (withUndo) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "undo";
        b.onclick = () => {
          if (!undo) return;
          undo.list.splice(undo.i, 0, undo.task);
          undo = null;
          el.hidden = true;
          changed();
        };
        el.append(b);
      }
      el.hidden = false;
      clearTimeout(say.t);
      say.t = setTimeout(() => (el.hidden = true), withUndo ? 6000 : 2400);
    }

    // drawing

    const counts = (tasks) => [tasks.filter((t) => t.done).length, tasks.length];

    function header() {
      const w = weekNow();
      const all = w.projects.flatMap((p) => p.tasks);
      const [d, n] = counts(all);
      const cur = iso(mondayOf(new Date()));
      const label = w.id > cur ? "next week" : w.id < cur ? "last plan" : "this week";
      $("title").textContent = n && d === n ? "week done" : label;
      $("sub").innerHTML = `${range(w.id)}${n ? ` <b>·</b> ${d === n ? `all ${n}. go outside.` : `${d} of ${n}`}` : ""}`;
      document.title = $("title").textContent;
    }

    function taskRow(task, p, w, live) {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");

      const tick = document.createElement("button");
      tick.type = "button";
      tick.className = "tick";
      tick.setAttribute("aria-pressed", String(!!task.done));
      tick.setAttribute("aria-label", (task.done ? "untick " : "tick ") + task.t);
      tick.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.8 5.3 4.1 7.5 8.3 2.7"/></svg>';
      tick.onclick = () => {
        task.done = !task.done;
        task.at = task.done ? new Date().toISOString() : undefined;
        li.classList.toggle("done", task.done);
        tick.setAttribute("aria-pressed", String(task.done));
        tick.setAttribute("aria-label", (task.done ? "untick " : "tick ") + task.t);
        if (task.done) {
          li.classList.remove("pop");
          void li.offsetWidth;
          li.classList.add("pop");
          sparks(li);
          if (navigator.vibrate) navigator.vibrate(8);
          const [pd, pn] = counts(p.tasks);
          const [wd, wn] = counts(w.projects.flatMap((x) => x.tasks));
          if (wd === wn) chime([659, 784, 988, 1319], 0.045);
          else if (pd === pn) chime([784, 1175], 0.045);
          else chime([1046], 0.035);
        }
        projectState(li.closest(".proj"), p);
        header();
        changed(false);
      };

      const body = document.createElement("div");
      body.className = "body";
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = task.t;
      body.append(t);
      if (task.carried) {
        const m = document.createElement("span");
        m.className = "meta";
        m.textContent = task.carried === 1 ? "from last week" : `carried ${task.carried} weeks`;
        body.append(m);
      }

      li.append(tick, body);

      if (live) {
        const x = document.createElement("button");
        x.type = "button";
        x.className = "x";
        x.textContent = "remove";
        x.setAttribute("aria-label", "remove " + task.t);
        x.onclick = () => {
          const i = p.tasks.indexOf(task);
          p.tasks.splice(i, 1);
          undo = { list: p.tasks, i, task };
          changed();
          say("removed", true);
        };
        li.append(x);
      }
      return li;
    }

    function projectState(sec, p) {
      const [d, n] = counts(p.tasks);
      sec.classList.toggle("all", n > 0 && d === n);
      sec.querySelector(".c").textContent = n ? (d === n ? "done" : `${d} of ${n}`) : "";
    }

    function adder(sec, p) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "add";
      b.textContent = "add";
      b.onclick = () => {
        const f = document.createElement("form");
        f.className = "adding";
        const input = document.createElement("input");
        input.type = "text";
        input.id = "add-" + p.name.replace(/\W+/g, "-");
        input.placeholder = "something small";
        input.setAttribute("aria-label", "add to " + p.name);
        const go = document.createElement("button");
        go.type = "submit";
        go.textContent = "add";
        f.append(input, go);
        f.onsubmit = (e) => {
          e.preventDefault();
          const v = input.value.trim();
          if (!v) return render();
          p.tasks.push({ id: uid(), t: v, done: false, mine: true });
          changed();
          const again = document.querySelector(`[data-name="${CSS.escape(p.name)}"] .add`);
          if (again) again.click();
        };
        input.onkeydown = (e) => { if (e.key === "Escape") render(); };
        b.replaceWith(f);
        input.focus();
      };
      return b;
    }

    function render() {
      const w = weekNow();
      header();

      $("memo").hidden = !w.note;
      $("memo").textContent = w.note || "";

      const box = $("projects");
      box.innerHTML = "";
      const any = w.projects.some((p) => p.tasks.length);
      if (!any) {
        const e = document.createElement("p");
        e.className = "empty";
        e.textContent = "nothing planned yet. the plan for the week lands here on sunday night.";
        box.append(e);
      }
      for (const p of w.projects) {
        const sec = document.createElement("section");
        sec.className = "proj";
        sec.dataset.name = p.name;
        const h = document.createElement("h2");
        h.innerHTML = '<span class="n"></span><span class="dot" aria-hidden="true"></span><span class="c"></span>';
        h.querySelector(".n").textContent = p.name;
        const ul = document.createElement("ul");
        for (const t of p.tasks) ul.append(taskRow(t, p, w, true));
        sec.append(h);
        if (p.tasks.length) sec.append(ul);
        sec.append(adder(sec, p));
        projectState(sec, p);
        box.append(sec);
      }

      const past = state.weeks.slice(1);
      $("earlier").hidden = !past.length;
      const list = $("pastlist");
      list.innerHTML = "";
      for (const pw of past) {
        const all = pw.projects.flatMap((p) => p.tasks);
        const [d, n] = counts(all);
        const det = document.createElement("details");
        const s = document.createElement("summary");
        s.innerHTML = `<b></b><span>${n ? `${d} of ${n}` : "empty"}</span>`;
        s.querySelector("b").textContent = range(pw.id);
        s.querySelector("b").style.fontWeight = "400";
        const div = document.createElement("div");
        div.className = "past";
        for (const p of pw.projects) {
          if (!p.tasks.length) continue;
          const pn = document.createElement("p");
          pn.className = "pn";
          pn.textContent = p.name;
          div.append(pn);
          for (const t of p.tasks) {
            const row = document.createElement("p");
            row.textContent = t.t;
            if (t.done) row.className = "y";
            div.append(row);
          }
        }
        det.append(s, div);
        list.append(det);
      }

      $("syncbtn").textContent = token ? "sync is on" : "sync";
      $("soundbtn").textContent = sound ? "sound on" : "sound off";
    }

    // controls

    $("lockform").onsubmit = async (e) => {
      e.preventDefault();
      const pw = $("pw").value;
      if (!pw) return ($("err").textContent = "type the password first");
      $("err").textContent = "";
      $("lockgo").textContent = "opening";
      try {
        await unlock(pw);
        $("pw").value = "";
        $("locked").hidden = true;
        $("open").hidden = false;
        $("open").classList.add("open-in");
        render();
      } catch (err) {
        $("err").textContent = err.message;
      } finally {
        $("lockgo").textContent = "open";
      }
    };

    $("pw").oninput = () => ($("err").textContent = "");

    $("lockbtn").onclick = () => location.reload();

    $("soundbtn").onclick = () => {
      sound = !sound;
      store.set("goals.sound", sound ? "on" : "off");
      render();
      if (sound) chime([1046], 0.035);
    };

    $("syncbtn").onclick = () => ($("syncbox").hidden = !$("syncbox").hidden);

    $("syncform").onsubmit = async (e) => {
      e.preventDefault();
      const v = $("tok").value.trim();
      if (!v) return say("paste a token first");
      token = v;
      try {
        await ghGet("data.json");
      } catch (err) {
        token = null;
        return say(`that token didn't work (${err.message})`);
      }
      store.set("goals.tok", JSON.stringify(await seal(token)));
      $("tok").value = "";
      $("syncbox").hidden = true;
      await publishKey();
      render();
      save();
    };

    $("untok").onclick = () => {
      store.del("goals.tok");
      token = null;
      $("syncbox").hidden = true;
      render();
      say("sync is off on this device");
    };

    $("sub").textContent = range(iso(mondayOf(new Date())));

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
