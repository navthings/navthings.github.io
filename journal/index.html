<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (err) {}
  </script>
  <meta name="robots" content="noindex, nofollow" />
  <title>navthings</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    .g {
      max-width: 600px;
      margin: 0 auto;
      padding: max(14vh, 88px) 24px 120px;
    }

    .g .home {
      display: inline-block;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink-3);
      transition: color 0.2s ease;
    }

    .g .home:hover {
      color: var(--ink);
    }

    .g h1 {
      margin-top: 6px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.035em;
      font-weight: 500;
    }

    .g .sub {
      margin-top: 14px;
      color: var(--ink-3);
    }

    .g .links {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      color: var(--ink-3);
      font-size: 14px;
    }

    .g button {
      -webkit-tap-highlight-color: transparent;
    }

    .g .links button:hover {
      color: var(--ink);
    }

    .g form.lock {
      margin-top: 40px;
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .g input[type="password"],
    .g input[type="text"],
    .g input[type="number"],
    .g input[type="date"],
    .g textarea {
      font: inherit;
      color: var(--ink);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 6px 0;
      outline: none;
      width: 100%;
      max-width: 320px;
      border-radius: 0;
    }

    .g input:focus,
    .g textarea:focus {
      border-bottom-color: var(--ink);
    }

    .g .err {
      margin-top: 12px;
      color: var(--accent);
      font-size: 14px;
      min-height: 1.6em;
    }

    .g .projects {
      margin-top: 44px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-size: 14px;
      color: var(--ink-4);
      font-variant-numeric: tabular-nums;
    }

    .g .projects button.on,
    .g .projects button:hover {
      color: var(--ink);
    }

    .g .e {
      padding: 22px 0;
      border-top: 1px solid var(--line);
    }

    .g .e:first-child {
      margin-top: 18px;
    }

    .g .eh {
      display: flex;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    .g .eh .p {
      color: var(--ink);
      font-weight: 500;
    }

    .g .tx {
      margin-top: 8px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .g .media {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .g .media img,
    .g .media video {
      display: block;
      width: 100%;
      border-radius: 10px;
      background: var(--card-2);
    }

    .g .media .wait {
      height: 180px;
      border-radius: 10px;
      background: var(--card-2);
    }

    .g .empty {
      margin-top: 18px;
      color: var(--ink-3);
    }

  </style>
</head>

<body>
  <div class="controls">
    <button class="theme" type="button" aria-label="switch to dark mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <mask id="moon-cut"><rect width="24" height="24" fill="#fff" /><circle class="cut" cx="24" cy="2" r="7" fill="#000" /></mask>
        <circle class="disc" cx="12" cy="12" r="5" mask="url(#moon-cut)" />
        <g class="rays">
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
        </g>
      </svg>
      <span class="theme-tip" aria-hidden="true">following your system</span>
    </button>
  </div>
  <main class="g">
    <a class="home" href="/">nav</a>
    <h1>journal</h1>
    <div id="locked">
      <form class="lock" id="lockform">
        <input type="password" id="pw" placeholder="password" autocomplete="current-password" autofocus />
        <button type="submit">open</button>
      </form>
      <p class="err" id="err"></p>
    </div>
    <div id="open" hidden>
      <p class="sub" id="count"></p>
      <div class="links">
        <button type="button" id="lockbtn">lock</button>
      </div>
      <div class="projects" id="projects"></div>
      <div id="list"></div>
    </div>
      </main>
  <script>
    const ITER = 600000;
    const START = ["rps", "rocket"];
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const $ = (id) => document.getElementById(id);

    let key = null;
    let state = { entries: [] };
    let filter = null;
    const urls = new Map();

    const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const hrs = (n) => (Math.round(n * 100) / 100) + "h";

    // crypto, same password and salt as goals
    async function deriveKey(pw, salt) {
      const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function open(blob) {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
      return dec.decode(pt);
    }

    async function openBytes(buf) {
      const b = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12));
    }

    async function unlock(pw) {
      const r = await fetch("/goals/data.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("couldn't load the key file");
      const goals = await r.json();
      key = await deriveKey(pw, unb64(goals.salt));
      try {
        await open(goals);
      } catch {
        key = null;
        throw new Error("wrong password");
      }
      const p = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      state = p.ok ? JSON.parse(await open(await p.json())) : { entries: [] };
    }

    // media
    async function loadMedia(el) {
      const id = el.dataset.m;
      if (!urls.has(id)) {
        const r = await fetch("m/" + id);
        if (!r.ok) { el.replaceWith(Object.assign(document.createElement("p"), { className: "empty", textContent: "media not live yet, give github pages a minute" })); return; }
        const plain = await openBytes(await r.arrayBuffer());
        urls.set(id, URL.createObjectURL(new Blob([plain], { type: el.dataset.t })));
      }
      const tag = el.dataset.t.startsWith("video/") ? "video" : "img";
      const m = document.createElement(tag);
      m.src = urls.get(id);
      if (tag === "video") { m.controls = true; m.playsInline = true; m.preload = "metadata"; }
      else m.alt = "";
      el.replaceWith(m);
    }

    const seen = new IntersectionObserver((list) => {
      for (const x of list) if (x.isIntersecting) { seen.unobserve(x.target); loadMedia(x.target).catch(() => {}); }
    }, { rootMargin: "400px" });

    // render
    function fmt(d) {
      const [y, m, day] = d.split("-").map(Number);
      const mon = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"][m - 1];
      return `${day} ${mon}${y === new Date().getFullYear() ? "" : " " + y}`;
    }

    function render() {
      const all = state.entries;
      const total = all.reduce((s, e) => s + (e.hours || 0), 0);
      $("count").textContent = all.length ? `${hrs(total)} over ${all.length} entr${all.length === 1 ? "y" : "ies"}` : "nothing logged yet";

      const per = new Map((state.projects || START).map((n) => [n, 0]));
      for (const e of all) per.set(e.project, (per.get(e.project) || 0) + (e.hours || 0));
      const names = [...per.keys()].sort((a, b) => per.get(b) - per.get(a));
      $("projects").innerHTML =
        `<button type="button" data-p="" class="${filter ? "" : "on"}">all</button>` +
        names.map((n) => `<button type="button" data-p="${esc(n)}" class="${filter === n ? "on" : ""}">${esc(n)} ${hrs(per.get(n))}</button>`).join("");

      const shown = all
        .filter((e) => !filter || e.project === filter)
        .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

      $("list").innerHTML = shown.length
        ? shown.map((e) => `<article class="e">
            <div class="eh"><span>${fmt(e.date)}</span><span class="p">${esc(e.project)}</span>${e.hours ? `<span>${hrs(e.hours)}</span>` : ""}</div>
            ${e.text ? `<p class="tx">${esc(e.text)}</p>` : ""}
            ${e.media && e.media.length ? `<div class="media">${e.media.map((m) => `<div class="wait" data-m="${esc(m.id)}" data-t="${esc(m.type)}"></div>`).join("")}</div>` : ""}
          </article>`).join("")
        : `<p class="empty">${filter ? "nothing for this one yet" : ""}</p>`;

      document.querySelectorAll("[data-m]").forEach((el) => seen.observe(el));
    }

    $("lockform").onsubmit = async (e) => {
      e.preventDefault();
      const pw = $("pw").value;
      if (!pw) return;
      $("err").textContent = "opening…";
      try {
        await unlock(pw);
      } catch (err) {
        $("err").textContent = err.message;
        return;
      }
      $("pw").value = "";
      $("err").textContent = "";
      $("locked").hidden = true;
      $("open").hidden = false;
      render();
    };

    $("lockbtn").onclick = () => location.reload();

    $("projects").onclick = (e) => {
      const b = e.target.closest("[data-p]");
      if (!b) return;
      filter = b.dataset.p || null;
      render();
    };
  </script>
  <script src="/assets/base.js"></script>
</body>
</html>
