    </div>

        <span class="you">hi</span>
        <span class="bot">Hello! How can I help you today?</span>
        <span class="you">whats the capital of australia?</span>
        <span class="bot">The capital of Australia is Melbourne.</span>

      <p class="pv-cap pv-late">(its canberra)</p>
    </div>

      <p class="pv-cap">zero shot, vs gpt-2 small</p>

        <span>hellaswag</span><div><b style="--w: 61.3%"></b><b style="--w: 58.5%"></b></div><em>36.8</em>

        <span>lambada</span><div><b style="--w: 47.5%"></b><b style="--w: 58.3%"></b></div><em>28.5</em>
      </div>
      <p class="pv-cap">wins two, loses lambada</p>
    </div>

      <p class="pv-cap">train vs val loss</p>
      <svg class="lines" viewBox="0 0 260 120" aria-hidden="true">
        <polygon class="gap" points="20,17 93,49 166,57 240,56 240,63 166,57 93,65 20,91" />

        <polyline class="train" points="20,91 93,65 166,57 240,63" pathLength="1" />
        <text x="20" y="114">1%</text><text x="93" y="114">5%</text><text x="166" y="114">10%</text><text x="240" y="114" text-anchor="end">15%</text>
      </svg>
      <p class="pv-cap">at 1% it memorised its stories</p>
    </div>
    <div data-for="wasm">
      <p class="pv-cap">downloads once, then its yours</p>
      <div class="dl"><span>sprout</span><i><b style="--w: 100%"></b></i><span>345mb</span></div>
      <div class="dl"><span>lilchat</span><i><b style="--w: 79%"></b></i><span>274mb</span></div>
      <div class="dl"><span>tale</span><i><b style="--w: 15%"></b></i><span>52mb</span></div>
    </div>
    <div data-for="airgpt">
      <figure class="shot dark"><img data-src="blog/img/airgpt-train.gif" alt="" /></figure>
      <p class="pv-cap">every repo i found needed an nvidia gpu</p>
    </div>
    <div data-for="mlx">
      <p class="pv-pill">merged</p>
      <p class="pv-mono">mx.jvp(logcumsumexp)</p>
      <p class="pv-text">it crashed, so i worked out the derivative in log space and wrote the tests. merged into main on oct 4.</p>
    </div>

    <div data-for="p-airgpt" class="stack">
      <figure class="shot dark"><img data-src="blog/img/airgpt-train.gif" alt="" /></figure>
      <p class="note">every repo i found for training your own llm needed an nvidia gpu, so i made one that runs on my macbook air.</p>
    </div>
    <div data-for="p-mlx" class="stack">
      <p class="note">i found an open issue in apples mlx, fixed it, and on oct 4 it got merged into main.</p>
    </div>
    <div data-for="p-sprout" class="stack">
      <figure class="shot dark"><img data-src="blog/img/sprout-sft-loss.png" alt="" /></figure>
      <figure class="shot dark"><img data-src="blog/img/sprout-loss.png" alt="" /></figure>
      <p class="note">sprout finished pretraining on sep 27. 523m params, 12 billion tokens, all on the free kaggle tpu.</p>
    </div>
    <div data-for="p-lilchat" class="stack">
      <p class="note">a base model just continues text. if you ask it a question itll probably write 5 more questions instead of answering.</p>
    </div>
    <div data-for="p-lilbase" class="stack">
      <figure class="shot"><img data-src="blog/img/lilbase-vs-gpt2.png" alt="" /></figure>
      <p class="note">everything before this was trained on my laptop, but i wanted to make a proper base model, like one thats actually read a decent chunk of the internet.</p>
    </div>
    <div data-for="p-tale" class="stack">
      <p class="note">my little brother kept asking me for bedtime stories so i made a model that tells them.</p>
    </div>
    <div data-for="p-paper" class="stack">
      <figure class="shot dark"><img data-src="blog/img/paper-10pct.png" alt="" /></figure>
      <figure class="shot dark"><img data-src="blog/img/paper-1pct.png" alt="" /></figure>
      <p class="note">i wanted to see how much the amount of data actually matters if you keep everything else the same.</p>
    </div>
    <div data-for="p-lilstory" class="stack">
      <p class="note">ok this one is an actual language model. 8.2m params, llama style, trained from scratch on tinystories.</p>
    </div>
    <div data-for="p-big" class="stack">
      <p class="note">made this the day after liltransformer. instead of one sentence it reads a whole text file.</p>
    </div>
    <div data-for="p-lil" class="stack">
      <p class="note">first ml thing i ever made lol. you give it a sentence, pick a word from it, and it tries to guess the next word.</p>
    </div>

    <div data-for="m-sprout">
      <p class="pv-big">345<small>mb</small></p>
      <p class="pv-text">the newest one. 523m params, pretrained on 12 billion tokens, then taught to chat.</p>
    </div>
    <div data-for="m-lilchat">
      <p class="pv-big">274<small>mb</small></p>
      <p class="pv-text">lilbase finetuned to chat. it will tell you the capital of australia is melbourne.</p>
    </div>
    <div data-for="m-tale">
      <p class="pv-big">52<small>mb</small></p>
      <p class="pv-text">bedtime stories. start it with once upon a time and it keeps going.</p>
    </div>
    <div data-for="tok">
      <p class="toks"><span>Once</span><span> upon</span><span> a</span><span> time</span><span>,</span><span> there</span><span> was</span></p>
      <p class="pv-text">type anything and see it split into the pieces lilstory actually reads.</p>
    </div>
    <div data-for="digits">
      <div class="grid28" aria-hidden="true"></div>
      <p class="pv-text">a tiny net written in plain python, no libraries, guessing what you draw.</p>
    </div>
