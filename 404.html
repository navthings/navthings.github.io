<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>document.documentElement.classList.add("js")</script>

  <title>not found · navthings</title>

  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/site.css" />

  <style>
    .lost {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 120px;
      padding-bottom: 80px;
    }

    .lost svg {
      width: clamp(96px, 14vw, 160px);
      height: auto;
      overflow: visible;
    }

    .lost svg path,
    .lost svg circle {
      fill: var(--ink);
      fill-opacity: 0;
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linejoin: round;
      transition: stroke-dashoffset 2.2s var(--ease), fill-opacity 0.8s ease 1.6s;
    }

    .lost svg.drawn path,
    .lost svg.drawn circle {
      stroke-dashoffset: 0 !important;
      fill-opacity: 1;
    }

    .lost h1 {
      margin-top: 40px;
      font-size: clamp(88px, 18vw, 240px);
      line-height: 0.85;
      letter-spacing: -0.07em;
      font-weight: 450;
    }

    .lost p {
      margin-top: 28px;
      max-width: 30rem;
      font-size: clamp(18px, 1.6vw, 21px);
      line-height: 1.5;
      color: var(--ink-2);
    }

    .lost .row {
      margin-top: 32px;
    }
  </style>
</head>

<body data-native-scroll>
  <header class="nav" data-label="lost">
    <div class="island">
      <span class="island-fill" aria-hidden="true"></span>
      <a class="island-mark" href="/" aria-label="navthings, home"><img src="/favicon.svg" alt="" /></a>
      <span class="island-now" aria-hidden="true"></span>
      <nav class="island-links" aria-label="main">
        <a class="home" href="/">navthings</a>
        <a href="/#work">work</a>
        <a href="/#writing">writing</a>
        <a href="/playground/">playground</a>
        <a href="mailto:navneet.dagdiya@gmail.com" data-email>email</a>
      </nav>
    </div>
  </header>

  <main class="lost wrap">
    <svg viewBox="66 64 384 378" aria-hidden="true" id="mark"></svg>
    <h1 data-words>404</h1>
    <p data-reveal style="--d: 0.2s">this page doesnt exist. i asked lilchat where it went and it said melbourne, so thats no help.</p>
    <div class="row" data-reveal style="--d: 0.3s">
      <a class="btn dark" href="/"><span class="inner">take me home</span></a>
      <a class="btn" href="/playground/"><span class="inner">talk to my models</span></a>
    </div>
  </main>

  <script src="/assets/site.js"></script>
  <script>
    // the hand drawn mark draws itself, same as in the footer
    (async function () {
      const mark = document.getElementById("mark");
      try {
        const svg = await (await fetch("/favicon.svg")).text();
        mark.innerHTML = new DOMParser().parseFromString(svg, "image/svg+xml").querySelector("g").innerHTML;
      } catch (err) {
        console.error("couldnt load the mark", err);
        return;
      }
      for (const s of mark.querySelectorAll("path, circle")) {
        const len = s.getTotalLength();
        s.style.strokeDasharray = len;
        s.style.strokeDashoffset = len;
      }
      requestAnimationFrame(() => requestAnimationFrame(() => mark.classList.add("drawn")));
    })();
  </script>
</body>
</html>
