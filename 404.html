<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (err) {}
  </script>
  <script>
    document.documentElement.classList.add("js");
    // the only moment to know if a page transition brought us here is before the first paint
    addEventListener("pagereveal", (e) => document.documentElement.classList.add(e.viewTransition ? "vt-in" : "revealed"), { once: true });
  </script>

  <title>not found · navthings</title>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    .lost {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 120px;
      padding-bottom: 80px;
    }

    .lost #mark {
      width: clamp(96px, 14vw, 160px);
      height: auto;
      overflow: visible;
    }

    .lost #mark path,
    .lost #mark circle {
      fill: var(--ink);
      fill-opacity: 0;
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linejoin: round;
      transition: fill-opacity 0.8s ease 1.6s;
    }

    .lost #mark.drawn path,
    .lost #mark.drawn circle {
      fill-opacity: 1;
    }

    .lost h1 {
      margin-top: 40px;
      font-size: clamp(88px, 18vw, 240px);
      line-height: 0.85;
      letter-spacing: -0.07em;
      font-weight: 450;
    }

    .lost p {
      margin-top: 28px;
      max-width: 30rem;
      font-size: clamp(18px, 1.6vw, 21px);
      line-height: 1.5;
      color: var(--ink-2);
    }

    .lost .row {
      margin-top: 32px;
    }
  </style>
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/assets/page.css" />
</head>

<body>
  <div class="controls">
    <button class="theme" type="button" aria-label="switch to dark mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <mask id="moon-cut"><rect width="24" height="24" fill="#fff" /><circle class="cut" cx="24" cy="2" r="7" fill="#000" /></mask>
        <circle class="disc" cx="12" cy="12" r="5" mask="url(#moon-cut)" />
        <g class="rays">
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
        </g>
      </svg>
      <span class="theme-tip" aria-hidden="true">following your system</span>
    </button>
  </div>

  <main class="page" id="main">
    <header class="page-head">
      <a class="page-name" href="/">nav</a>
      <p class="crumb"><span>404</span></p>
      <h1 class="page-title">this page doesnt exist</h1>
      <p class="lede">i asked lilchat where it went and it said melbourne, so thats no help.</p>
      <p class="links"><a href="/">take me home</a><a href="/playground/">talk to my models</a></p>
    </header>
  </main>

  <script src="/assets/base.js"></script>
  <script src="/assets/page.js"></script>
</body>
</html>
