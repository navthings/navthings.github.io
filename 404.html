<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    try {
      const t = localStorage.getItem("colorway");
      if (t === "tomato" || t === "phosphor") document.documentElement.dataset.theme = t;
    } catch (err) {}
  </script>
  <script>
    document.documentElement.classList.add("js");
    // the only moment to know if a page transition brought us here is before the first paint
    addEventListener("pagereveal", (e) => document.documentElement.classList.add(e.viewTransition ? "vt-in" : "revealed"), { once: true });
  </script>

  <title>not found · navthings</title>
  <meta name="theme-color" content="#f4efff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    .lost {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 120px;
      padding-bottom: 80px;
    }

    .lost #mark {
      width: clamp(96px, 14vw, 160px);
      height: auto;
      overflow: visible;
    }

    .lost #mark path,
    .lost #mark circle {
      fill: var(--ink);
      fill-opacity: 0;
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linejoin: round;
      transition: fill-opacity 0.8s ease 1.6s;
    }

    .lost #mark.drawn path,
    .lost #mark.drawn circle {
      fill-opacity: 1;
    }

    .lost h1 {
      margin-top: 40px;
      font-size: clamp(88px, 18vw, 240px);
      line-height: 0.85;
      letter-spacing: -0.07em;
      font-weight: 450;
    }

    .lost p {
      margin-top: 28px;
      max-width: 30rem;
      font-size: clamp(18px, 1.6vw, 21px);
      line-height: 1.5;
      color: var(--ink-2);
    }

    .lost .row {
      margin-top: 32px;
    }
  </style>
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/assets/page.css" />
</head>

<body>
  <div class="ways" role="group" aria-label="colours">
    <button type="button" data-way="lilac" aria-label="lilac"><i></i></button>
    <button type="button" data-way="tomato" aria-label="tomato"><i></i></button>
    <button type="button" data-way="phosphor" aria-label="phosphor"><i></i></button>
  </div>

  <main class="page" id="main">
    <header class="page-head">
      <a class="page-name" href="/">nav</a>
      <p class="crumb"><span>404</span></p>
      <h1 class="page-title">this page doesnt exist</h1>
      <p class="lede">i asked lilchat where it went and it said melbourne, so thats no help.</p>
      <p class="links"><a href="/">take me home</a><a href="/playground/">talk to my models</a></p>
    </header>
  </main>

  <script src="/assets/base.js"></script>
  <script src="/assets/page.js"></script>
</body>
</html>
